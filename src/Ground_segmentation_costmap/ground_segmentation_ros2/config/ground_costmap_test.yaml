controller_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 0.1
    controller_frequency: 5.0

    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.2

      rolling_window: true
      width: 10
      height: 5
      resolution: 0.05
      always_send_full_costmap: true

      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"

      plugins: ["ground_consistency", "inflation_layer"]

      ground_consistency:
        plugin: "nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer"

        ground_points_topic: /ground_segmentation/ground_points
        nonground_points_topic: /ground_segmentation/obstacle_points

        tf_timeout: 0.1
        min_clearance: 0.15
        robot_height: 0.38
        maximum_height_filter: 0.4
        max_data_range: 3.0

        ground_inc: 1.25
        nonground_inc: 1.5
        nonground_decay: 0.90
        ground_decay: 0.85
        nonground_prob_thresh: 0.75
        nonground_occ_thresh: 2.0
        max_score: 5000.0

        discretize_costs: true
        footprint_clearing_enabled: true
        ground_neighbor_search_cells: 1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.12
        cost_scaling_factor: 3.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0
    attempt_respawn_reconnection: false
    node_names:
      - controller_server
