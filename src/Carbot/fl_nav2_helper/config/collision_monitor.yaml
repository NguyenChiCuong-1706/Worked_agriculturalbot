collision_monitor:
  ros__parameters:
    enabled: true
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    use_composition: false
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_nav_checked"
    transform_tolerance: 0.3
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: true

    polygons: ["PolygonStop", "PolygonSlow"]

    PolygonStop:
      type: "polygon"
      points: "[[0.6, 0.3],[0.6,-0.3],[-0.4,-0.3],[-0.4,0.3]]"
      action_type: "stop"
      min_points: 6
      visualize: true
      polygon_pub_topic: "polygon_stop"

    PolygonSlow:
      type: "polygon"
      points: "[[0.7, 0.4],[0.7,-0.4],[-0.4,-0.4],[-0.4,0.4]]"
      action_type: "slowdown"
      min_points: 6
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: "polygon_slowdown"

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
