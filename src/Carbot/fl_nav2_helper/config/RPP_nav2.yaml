controller_server:
  ros__parameters:
    controller_frequency: 20.0
    use_sim_time: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      required_movement_angle: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.5
      #plugin: "nav2_controller::SimpleProgressChecker"
      #required_movement_radius: 0.5
      #movement_time_allowance: 10.0
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Speed params
      max_linear_vel: 0.1
      min_linear_vel: -0.1
      
      max_angular_vel: 1.0
      min_angular_vel: -1.0
      
      max_linear_accel: 0.5
      max_linear_decel: -0.5
      max_angular_accel: 2.0
      max_angular_decel: -2.0
      
      # lookahead params
      use_velocity_scaled_lookahead_dist: false
      lookahead_dist: 0.3
      min_lookahead_dist: 0.1
      max_lookahead_dist: 0.4
      lookahead_time: 0.5

      # Rotate to heading (FALSE)
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.3 #523 # 30 degree
      
      # Approach goals (TRUE)
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      stateful: true
      
      # Approach obstabcles (FALSE)
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      min_distance_to_obstacle: 0.0
      allow_obstacle_checking_beyond_goal: false
      
      # Curvature speed limit (FALSE)
      use_regulated_linear_velocity_scaling: false # slow on high curvature paths
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.5
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.1
      
      # Approach high cost area (FALSE)
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      
      # Reversing (FALSE)
      allow_reversing: false

      # DWPP algorithm (FALSE)
      use_dynamic_window: false
