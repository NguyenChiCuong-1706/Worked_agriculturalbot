bt_navigator:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    default_nav_to_pose_bt_xml: "/home/beinglab-kilted/carbot_ws/src/Carbot/fl_nav2_helper/config/navigate_on_route_graph_w_recovery.xml"
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /lidar_odom
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 1000
    introspection_mode: "disabled"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
